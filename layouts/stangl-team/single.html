<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team | Stangl Lab</title>
  <meta name="description"
        content="Meet the Stangl Lab team at Boston University.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet">

  <link rel="stylesheet"
        href="{{ "css/stangl-navigation.css" | relURL }}">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: white;
      color: #111;
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    a {
      color: #b30815;
      text-underline-offset: 2px;
    }

    a:focus-visible {
      outline: 2px solid #b30815;
      outline-offset: 5px;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 34px 24px 48px;
    }

    h1 {
      margin: 0 0 48px;
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 42px 28px;
    }

    .team-member {
      min-width: 0;
      text-align: center;
    }

    .team-photo {
      display: block;
      width: 160px;
      height: 160px;
      max-width: 100%;
      margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 35%;
      background: #eee;
    }

    .team-name {
      min-height: 2.8em;
      margin: 0 0 6px;
      color: #b30815;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.4;
    }

    .team-role {
      min-height: 2.8em;
      margin: 0 0 8px;
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }

    .team-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .team-icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #b30815;
      text-decoration: none;
    }

    .team-icons a:hover {
      background: #f9e9eb;
    }

    .team-icons svg {
      width: 20px;
      height: 20px;
    }

    .alumni {
      margin-top: 60px;
      padding-top: 28px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
    }

    .alumni h2 {
      margin: 0 0 24px;
      font-size: 26px;
    }

    .alumni-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px 64px;
    }

    .alumni-name {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
    }

    .alumni-role {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .site-footer {
      background: #e6e6e6;
      padding: 7px 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    .site-footer p { margin: 0; }

    @media (max-width: 850px) {
      .team-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .team-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 32px 20px;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 36px;
      }

      .team-photo {
        width: 140px;
        height: 140px;
      }

      .team-name { font-size: 16px; }
    }

    @media (max-width: 380px) {
      .team-grid {
        grid-template-columns: 1fr;
      }

      .team-name,
      .team-role {
        min-height: 0;
      }
    }
  </style>
</head>

<body>
  {{ partial "stangl-header.html" . }}

  <main>
    <h1>MEET THE TEAM</h1>

    <div class="team-grid">
      {{ range .Params.members }}
        <article class="team-member">
          <img class="team-photo"
               src="{{ .photo }}"
               alt="{{ .name }}"
               width="160"
               height="160"
               loading="lazy">

          <h2 class="team-name">{{ .name }}</h2>
          <p class="team-role">{{ .role }}</p>

          <div class="team-icons">
            <a href="mailto:{{ .email }}"
               aria-label="Email {{ .name }}"
               title="Email {{ .name }}">
              <svg viewBox="0 0 24 24"
                   fill="none"
                   stroke="currentColor"
                   stroke-width="1.8"
                   stroke-linecap="round"
                   stroke-linejoin="round"
                   aria-hidden="true">
                <rect x="3" y="5" width="18" height="14"
                      rx="2"></rect>
                <path d="m3 7 9 6 9-6"></path>
              </svg>
            </a>
          </div>
        </article>
      {{ end }}
    </div>

    <section class="alumni" aria-labelledby="alumni-title">
      <h2 id="alumni-title">ALUMNI</h2>

      <div class="alumni-list">
        {{ range .Params.alumni }}
          <div>
            <p class="alumni-name">{{ .name }}</p>
            <p class="alumni-role">{{ .role }}, {{ .years }}</p>
          </div>
        {{ end }}
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      Stangl Lab<br>
      Boston University<br>
      610 Commonwealth Ave<br>
      Boston, MA 02215
    </p>
  </footer>
</body>
</html>
